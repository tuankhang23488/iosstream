name: Build Deb

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync libxml2-dev wget
          wget https://apt.procurs.us/pool/main/iphoneos-arm64/1800/ldid_2.1.5-procursus7_iphoneos-arm64.deb
          sudo dpkg -i ldid_2.1.5-procursus7_iphoneos-arm64.deb || true
          sudo ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 /usr/lib/x86_64-linux-gnu/libtinfo.so.5 || true

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Build Package
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: iosstream-deb
          path: packages/*.deb
