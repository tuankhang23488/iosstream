name: Build Deb

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make rsync libxml2-dev wget unzip curl
          wget http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.4-2_amd64.deb
          sudo dpkg -i libtinfo5_6.4-2_amd64.deb || true
          
      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Install Toolchain
        run: |
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64e-clang-toolchain.tar.lzma
          mkdir -p $THEOS/toolchain/linux/iphone/
          tar --lzma -xvf linux-ios-arm64e-clang-toolchain.tar.lzma -C $THEOS/toolchain/linux/iphone/ --strip-components=1
          rm linux-ios-arm64e-clang-toolchain.tar.lzma

      - name: Setup Ldid
        run: |
          wget https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_linux_x86_64
          chmod +x ldid_linux_x86_64
          sudo mv ldid_linux_x86_64 /usr/local/bin/ldid

      - name: Install SDK
        run: |
          wget https://github.com/theos/sdks/archive/master.zip
          unzip master.zip
          mkdir -p $THEOS/sdks
          mv sdks-master/iPhoneOS15.6.sdk $THEOS/sdks/ || mv sdks-master/iPhoneOS14.5.sdk $THEOS/sdks/

      - name: Build Package
        run: |
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Upload Deb
        uses: actions/upload-artifact@v4
        with:
          name: iosstream-deb
          path: packages/*.deb
